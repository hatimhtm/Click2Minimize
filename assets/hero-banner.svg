  <circle cx="1098" cy="136" r="4" fill="#2E4FD6"/>
  <text x="1098" y="180" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.2" fill="#14151A">DMG</text>
  <text x="1098" y="211" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.2" fill="#14151A">v2.1</text>
  <text x="1098" y="242" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2.2" fill="#14151A">MACOS 13+</text>
