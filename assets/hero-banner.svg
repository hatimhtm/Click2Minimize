<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Click2Minimize: macOS dock utility">
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1090" cy="200" r="340"><stop offset="0" stop-color="#2E4FD6" stop-opacity=".13"/><stop offset="1" stop-color="#2E4FD6" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".78"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".46"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14151A" flood-opacity=".10"/></filter>
    <style>
      text { font-family: Satoshi,'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#EBEAE6"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#14151A" stroke-opacity=".08"/>
  <circle cx="84" cy="71" r="4" fill="#2E4FD6"/>
  <text x="102" y="76" font-size="14" font-weight="600" letter-spacing="1.68" fill="#5D5F65">SWIFT · COCOA · MENUBAR EXTRA · CGEVENT TAP · AXUIELEMENT · APPLESCRIPT</text>
  <text x="80" y="134" font-size="15" font-weight="700" letter-spacing="2.40" fill="#2E4FD6">MACOS UTILITY · SOURCE-AVAILABLE · SHIPPED</text>
  <text x="78" y="262" font-size="100.0" font-weight="700" letter-spacing="-3.50" fill="#14151A">Click2Minimize<tspan fill="#2E4FD6">.</tspan></text>
  <text x="80" y="316" font-size="22" font-weight="500" fill="#2B2D33">Click a dock icon · windows minimize · native behaviour</text>
  <line x1="80" y1="342" x2="1200" y2="342" stroke="#14151A" stroke-opacity=".10"/>
